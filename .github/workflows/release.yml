name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  GOFLAGS: -tags=novulkan

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit on main
        run: git merge-base --is-ancestor HEAD origin/main

  build:
    needs: verify
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          # pitwall-win ships Windows builds only; remote daemons install
          # upstream's binaries. Gio needs no cgo on Windows, so Linux
          # cross-compiles it.
          - { goos: windows, goarch: amd64, runner: ubuntu-latest }
          - { goos: windows, goarch: arm64, runner: ubuntu-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install Gio's build dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles-dev libegl-dev libffi-dev libxcursor-dev libxfixes-dev
      - name: Build and pack
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.goos == 'windows' && '0' || '1' }}
          TAG: ${{ github.ref_name }}
        run: |
          exe=pitwall ldflags="-X main.version=$TAG"
          # why: a GUI program gets no console window; its commands attach to the terminal's (attachConsole).
          if [ "$GOOS" = windows ]; then exe=pitwall.exe ldflags="$ldflags -H windowsgui"; fi
          mkdir -p stage dist
          go build -trimpath -ldflags "$ldflags" -o "stage/$exe" ./cmd/pitwall
          cp LICENSE THIRD_PARTY_NOTICES.md stage/
          set -- "$exe" LICENSE THIRD_PARTY_NOTICES.md
          case "$GOOS" in
            linux)
              # why: the AUR package installs the desktop entry and icon from the archive.
              cp packaging/pitwall.desktop packaging/pitwall.svg stage/
              set -- "$@" pitwall.desktop pitwall.svg
              ;;
            darwin)
              # packaging/pitwall.icns is pitwall.svg at 16 to 1024 px; rebuild it when the svg changes.
              app=stage/pitwall.app/Contents
              mkdir -p "$app/MacOS" "$app/Resources"
              sed "s/@VERSION@/${TAG#v}/" packaging/Info.plist > "$app/Info.plist"
              cp packaging/pitwall.icns "$app/Resources/"
              # why: tar stores a hard link once, so the bundle adds no second copy of the binary.
              ln stage/pitwall "$app/MacOS/pitwall"
              set -- "$@" pitwall.app
              ;;
          esac
          name="pitwall_${GOOS}_${GOARCH}"
          if [ "$GOOS" = windows ]; then
            (cd stage && zip -q "../dist/$name.zip" "$@")
          else
            tar -czf "dist/$name.tar.gz" -C stage "$@"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pitwall_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          # why: the release job attaches these to the GitHub release within minutes; kept longer they only fill Actions storage.
          retention-days: 1

  release:
    needs: build
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist && sha256sum pitwall_* > checksums.txt && cat checksums.txt)
          awk -v tag="$TAG" '$0 == "## " tag {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section '## $TAG'" >&2
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "pitwall $TAG" --notes-file notes.md --verify-tag --latest

  # why: upstream's packages job renders the Homebrew formula, the Scoop
  # manifest and the AUR files from every platform's asset and pushes them
  # to upstream's taps. pitwall-win ships Windows zips only and owns no
  # taps, so the job is dropped rather than taught to skip.
