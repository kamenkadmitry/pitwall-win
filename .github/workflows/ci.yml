name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # why: the build the maintainer runs and tests; Gio draws through OpenGL.
  GOFLAGS: -tags=novulkan

jobs:
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # why: HEAD is the PR merged into its base, so HEAD^1 is the base.
          fetch-depth: 2
          persist-credentials: false
      - name: Require a CHANGELOG.md entry for cmd/ and internal/ changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if git diff --quiet HEAD^1 HEAD -- cmd internal; then
            echo 'No change under cmd/ or internal/.'
            exit 0
          fi
          # why: read live, so adding the label and re-running the job skips it.
          label=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq 'any(.labels[]; .name == "no-changelog")') || label=false
          if [ "$label" = true ]; then
            echo 'Skipped: the PR has the no-changelog label.'
            exit 0
          fi
          git show HEAD^1:CHANGELOG.md | awk '/^## /{n++} n==1' > base.md
          awk '/^## /{n++} n==1' CHANGELOG.md > head.md
          added=$(grep -vxFf base.md head.md | grep -v '^## ' | grep '[^[:space:]]' || true)
          if [ -n "$added" ]; then
            printf 'New in the top CHANGELOG.md section:\n%s\n' "$added"
            exit 0
          fi
          echo "::error file=CHANGELOG.md::This PR changes cmd/ or internal/ but adds no line under the top '## Unreleased' section of CHANGELOG.md. Add one, or ask a maintainer for the no-changelog label and re-run this job."
          exit 1

  # Windows-only repo: linux/macOS legs are gone. Their checks that still
  # matter (gofmt, the shell-script tests, both release arches) live here.
  other:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # why: the runner's git checks out CRLF, gofmt counts the \r as
      # unformatted and sh reads it as part of a command. The setting has to
      # be there before the checkout: git checkout-index -f afterwards leaves
      # every file whose stat data the index still matches as it is, so it
      # rewrote only the files checked out last and gofmt failed on the rest.
      - name: Check out with LF line ends
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          # why: a hung Windows test can hold a file in the build cache, failing the cache save.
          cache: false
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'gofmt needed:\n%s\n' "$unformatted"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test gioui.org/app
      - name: Link both Windows release binaries with their icon
        run: |
          GOARCH=amd64 go build -ldflags=-H=windowsgui -o /dev/null ./cmd/pitwall
          GOARCH=arm64 go build -ldflags=-H=windowsgui -o /dev/null ./cmd/pitwall
      - name: Check the vendored terminal module
        run: |
          go -C third_party/x-vt vet ./...
          go -C third_party/x-vt test -timeout 5m ./...
      - name: Scripts
        run: |
          sh -n scripts/install.sh
          sh -n scripts/get.sh
          sh scripts/get_test.sh
          sh -n scripts/get-host.sh
          sh scripts/get-host_test.sh
          sh scripts/release_test.sh
          sh scripts/apk_test.sh
          sh scripts/apk-release_test.sh
      - name: get.ps1
        # why: the runner's Windows PowerShell 5.1 crashed loading its own assembly.
        shell: pwsh
        run: |
          $env:PITWALL_GET_TEST = '1'
          . ./scripts/get.ps1
          if ((Get-PitwallAsset AMD64) -ne 'pitwall_windows_amd64.zip' -or (Get-PitwallAsset ARM64) -ne 'pitwall_windows_arm64.zip') { exit 1 }
          $exe = (Get-Command cmd.exe).Source
          $lnk = Join-Path $env:RUNNER_TEMP 'pitwall.lnk'
          New-PitwallShortcut $exe $lnk
          $s = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          if ($s.TargetPath -ne $exe -or $s.IconLocation -ne "$exe,0") { "shortcut: $($s.TargetPath) $($s.IconLocation)"; exit 1 }
      - name: Stop leftover test processes
        if: always()
        shell: pwsh
        run: |
          Get-Process | Where-Object { $_.ProcessName -like '*.test' -or $_.ProcessName -like 'pitwall*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          exit 0

  # windows-test splits the suite across runners: the git-heavy packages
  # that flake when they compete for CPU stay serial (-p=1), each on its
  # own runner, and everything else runs with the default -p (all cores).
  windows-test:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [daemon-ah, daemon-ip, daemon-qz, gitstat, cmd, rest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # why: runner C: writes at ~120 MB/s while D: does ~210 MB/s. Only
      # the build cache moves: test temp dirs must stay on C: because
      # upstream tests assume os.TempDir and C: are the same drive
      # (TestCwdFollowsCd sends "cd C:\Windows" without /d).
      - name: Redirect the build cache to the D drive
        run: echo "GOCACHE=$RUNNER_TEMP/go-build" >> "$GITHUB_ENV"
      - name: Hardware report
        run: |
          echo "cores: $(nproc)"
          powershell -NoProfile -c "Write-Output ('RAM GB: ' + [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory/1GB,1))"
          for d in "$TEMP" "$RUNNER_TEMP" "$GITHUB_WORKSPACE"; do
            u=$(cygpath -u "$d")
            t0=$(date +%s%N)
            dd if=/dev/zero of="$u/cibench.tmp" bs=1M count=256 2>/dev/null
            sync
            t1=$(date +%s%N)
            echo "$d: write $((256 * 1024 * 1000000000 / (t1 - t0) / 1024)) MB/s"
            rm -f "$u/cibench.tmp"
          done
      # why: internal/daemon alone was the 5-minute floor; its tests split
      # by name range so a new test lands in a shard on its own.
      - name: Test daemon A-H
        if: matrix.shard == 'daemon-ah'
        run: go test -p=1 -timeout 10m -run 'Test[A-H]' ./internal/daemon
      - name: Test daemon I-P
        if: matrix.shard == 'daemon-ip'
        run: go test -p=1 -timeout 10m -run 'Test[I-P]' ./internal/daemon
      - name: Test daemon Q-Z
        if: matrix.shard == 'daemon-qz'
        run: go test -p=1 -timeout 10m -run 'Test[Q-Z]' ./internal/daemon
      - name: Test gitstat
        if: matrix.shard == 'gitstat'
        run: go test -p=1 -timeout 10m ./internal/gitstat
      - name: Test cmd
        if: matrix.shard == 'cmd'
        run: go test -p=1 -timeout 10m ./cmd/pitwall
      - name: Test the rest
        if: matrix.shard == 'rest'
        run: go test -timeout 5m $(go list ./... | grep -v -e '/internal/daemon$' -e '/internal/gitstat$' -e '/cmd/pitwall$')
      - name: Stop leftover test processes
        if: always()
        shell: pwsh
        run: |
          Get-Process | Where-Object { $_.ProcessName -like '*.test' -or $_.ProcessName -like 'pitwall*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          exit 0
